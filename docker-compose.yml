services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ghosttrace
      POSTGRES_USER: ghosttrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghosttrace"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ghosttrace:${POSTGRES_PASSWORD}@db:5432/ghosttrace
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
