# Render Blueprint: New > Blueprint > pick this repo. Builds the Dockerfile and creates the database.
databases:
  - name: ghosttrace-db
    plan: free
    databaseName: ghosttrace
    user: ghosttrace

services:
  - type: web
    name: ghosttrace
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ghosttrace-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: GITHUB_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
